apiVersion:  argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL:  https://github.com/Mihirbhandari08/gitops-platform.git
    targetRevision: HEAD
    path:  platform-root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
