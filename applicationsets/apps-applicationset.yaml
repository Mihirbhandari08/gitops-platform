apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-platform-apps
  namespace: argocd
spec: 
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - app: nginx
          - list:
              elements:
                - env: dev
                - env: prod
  template:
    metadata:
      name: '{{.app}}-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Mihirbhandari08/gitops-platform.git
        targetRevision: HEAD
        path: 'apps/nginx'
        helm:  
          valueFiles:
            - values.yaml
            - '../../environments/{{.env}}/nginx-values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true