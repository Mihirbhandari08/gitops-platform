apiVersion:  argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.18.6
    helm:
      values:  |
        resources:
          requests:
            cpu:  "100m"
            memory:  "128Mi"
          limits: 
            cpu: "200m"
            memory: "256Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
