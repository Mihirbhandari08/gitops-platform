apiVersion:  argoproj.io/v1alpha1
kind:  Application
metadata:
  name:  kyverno
  namespace:  argocd
spec:
  project:  default
  source:
    repoURL:  https://kyverno.github.io/kyverno/
    chart :  kyverno
    targetRevision:  3.8.0
  destination:
    server: https://kubernetes.default.svc
    namespace:  kyverno
  syncPolicy:
    automated:
      prune:  true
      selfHeal:  true
    syncOptions:
      -  ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io      # 3. Ignores runtime schema variations on Kyverno CRDs
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/managedFields
        - /metadata/annotations
        - /metadata/labels
        - /spec/conversion     