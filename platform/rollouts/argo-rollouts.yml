apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.41.0
    helm:
      values: |
        # 1. Controller Limits (What you already had)
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits: 
            cpu: "200m"
            memory: "256Mi"

        # 2. Dashboard Limits (Required to clear the Kyverno webhook block)
        dashboard:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true  # Strongly recommended to prevent missing namespace errors
