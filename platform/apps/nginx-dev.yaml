apiVersion:  argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mihirbhandari08/gitops-platform.git
    targetRevision: HEAD
    path: apps/nginx
    helm:
      valueFiles:
        - values.yaml
        - ../../environments/dev/nginx-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
